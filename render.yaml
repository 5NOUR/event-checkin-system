services:
  - type: web
    name: event-checkin-api
    env: node
    region: frankfurt # أو oregon / singapore
    plan: free
    branch: main
    rootDir: backend
    buildCommand: |
      npm install
      npx prisma generate
      npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # سيُملأ يدوياً في Render Dashboard
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true # Render يولّد قيمة تلقائياً
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: console # أو resend لاحقاً
      - key: EMAIL_FROM
        value: noreply@eventcheck.app
      - key: EMAIL_FROM_NAME
        value: EventCheck
