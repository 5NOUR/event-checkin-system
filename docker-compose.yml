version: "3.8"

services:
  # خدمة قاعدة البيانات PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: event-checkin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventadmin
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: eventdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventadmin -d eventdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # خدمة Backend (سنفعّلها لاحقاً، لكن نضع هيكلها الآن)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: event-checkin-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://eventadmin:securepassword123@postgres:5432/eventdb
      - PORT=5000
      - JWT_SECRET=supersecretjwtkey123456
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
